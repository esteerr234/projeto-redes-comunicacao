<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetChat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
        }
        
        header {
            border-bottom: 1px solid #f0f0f0;
            padding: 20px 40px;
            background: #fafafa;
        }
        
        header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: calc(100vh - 80px );
        }
        
        .chat-section {
            border-right: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }
        
        .chat-header {
            padding: 20px 40px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .chat-header h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .input-group input,
        .input-group select {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            background: #fafafa;
        }
        
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            background: #ffffff;
            border-color: #1a1a1a;
        }
        
        .chat-input-area {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        
        .chat-input-area textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            height: 40px;
            background: #fafafa;
        }
        
        .chat-input-area textarea:focus {
            outline: none;
            background: #ffffff;
            border-color: #1a1a1a;
        }
        
        .chat-input-area button {
            padding: 10px 20px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        
        .chat-input-area button:hover {
            background: #333;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column-reverse;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
        }
        
        .message-user {
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .message-type {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .message-time {
            font-size: 12px;
            color: #ccc;
        }
        
        .message-content {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .empty-state {
            color: #ccc;
            text-align: center;
            font-size: 13px;
            margin: auto;
        }
        
        .dashboard-section {
            display: flex;
            flex-direction: column;
            background: #fafafa;
            padding: 40px;
            overflow-y: auto;
        }
        
        .dashboard-section h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 30px;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .metric {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
        }
        
        .metric-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .metric-value {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .metric-unit {
            font-size: 14px;
            color: #ccc;
            margin-left: 4px;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
            height: 250px;
            margin-bottom: 40px;
        }
        
        .chart-container canvas {
            max-height: 100%;
        }
        
        .alerts-section {
            margin-top: 40px;
        }
        
        .alerts-section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .alert-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid #ff6b6b;
            font-size: 13px;
        }
        
        .alert-type {
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .alert-value {
            color: #666;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .alert-time {
            color: #ccc;
            font-size: 11px;
            margin-top: 4px;
        }
        
        .no-alerts {
            color: #ccc;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }
        
        .status {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .status.sucesso {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        
        .status.erro {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }
        
        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
            
            .chat-section {
                border-right: none;
                border-bottom: 1px solid #f0f0f0;
                min-height: 50vh;
            }
            
            .dashboard-section {
                min-height: 50vh;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 16px 20px;
            }
            
            header h1 {
                font-size: 20px;
            }
            
            .chat-header {
                padding: 16px 20px;
            }
            
            .messages {
                padding: 20px;
            }
            
            .dashboard-section {
                padding: 20px;
            }
            
            .input-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NetChat</h1>
        </header>
        
        <div class="layout">
            <div class="chat-section">
                <div class="chat-header">
                    <h2>Mensagens</h2>
                    <div id="status-chat"></div>
                    
                    <div class="input-group">
                        <input type="text" id="usuario" placeholder="Seu nome">
                        <select id="tipo">
                            <option value="mensagem">Mensagem</option>
                            <option value="alerta">Alerta</option>
                            <option value="evento">Evento</option>
                        </select>
                    </div>
                    
                    <div class="chat-input-area">
                        <textarea id="conteudo" placeholder="Digite sua mensagem..."></textarea>
                        <button onclick="enviarMensagem()">Enviar</button>
                    </div>
                </div>
                
                <div class="messages" id="lista-mensagens">
                    <div class="empty-state">Nenhuma mensagem ainda</div>
                </div>
            </div>
            
            <div class="dashboard-section">
                <h2>Dashboard</h2>
                
                <div class="metrics">
                    <div class="metric">
                        <div class="metric-label">RTT</div>
                        <div>
                            <span class="metric-value" id="metrica-rtt">0</span>
                            <span class="metric-unit">ms</span>
                        </div>
                    </div>
                    
                    <div class="metric">
                        <div class="metric-label">Throughput</div>
                        <div>
                            <span class="metric-value" id="metrica-throughput">0</span>
                            <span class="metric-unit">kbps</span>
                        </div>
                    </div>
                    
                    <div class="metric">
                        <div class="metric-label">Packet Loss</div>
                        <div>
                            <span class="metric-value" id="metrica-loss">0</span>
                            <span class="metric-unit">%</span>
                        </div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <canvas id="grafico"></canvas>
                </div>
                
                <div class="alerts-section">
                    <h3>Alertas</h3>
                    <div id="lista-alertas"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3000';
        let socket = null;
        let grafico = null;
        let dadosGrafico = {
            labels: [],
            rtt: []
        };
        
        window.addEventListener('load', ( ) => {
            conectarWebSocket();
            carregarMensagens();
            carregarAlertas();
            setInterval(atualizarMetricasAuto, 5000);
        });
        
        function conectarWebSocket() {
            socket = io(API_URL);
            
            socket.on('nova_mensagem', (mensagem) => {
                adicionarMensagemUI(mensagem);
            });
            
            socket.on('novo_alerta', (alerta) => {
                adicionarAlertaUI(alerta);
            });
        }
        
        async function enviarMensagem() {
            const tipo = document.getElementById('tipo').value;
            const usuario = document.getElementById('usuario').value;
            const conteudo = document.getElementById('conteudo').value;
            
            if (!usuario || !conteudo) {
                mostrarStatus('Preencha todos os campos', 'erro');
                return;
            }
            
            try {
                const resposta = await fetch(`${API_URL}/api/mensagens`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo, usuario, conteudo })
                });
                
                const dados = await resposta.json();
                
                if (dados.sucesso) {
                    mostrarStatus('Mensagem enviada', 'sucesso');
                    document.getElementById('conteudo').value = '';
                } else {
                    mostrarStatus(dados.erro, 'erro');
                }
            } catch (erro) {
                mostrarStatus('Erro ao enviar', 'erro');
            }
        }
        
        async function carregarMensagens() {
            try {
                const resposta = await fetch(`${API_URL}/api/mensagens`);
                const mensagens = await resposta.json();
                const lista = document.getElementById('lista-mensagens');
                lista.innerHTML = '';
                
                if (mensagens.length === 0) {
                    lista.innerHTML = '<div class="empty-state">Nenhuma mensagem ainda</div>';
                    return;
                }
                
                mensagens.reverse().forEach(msg => adicionarMensagemUI(msg));
            } catch (erro) {
                console.error('Erro:', erro);
            }
        }
        
        function adicionarMensagemUI(msg) {
            const lista = document.getElementById('lista-mensagens');
            if (lista.querySelector('.empty-state')) {
                lista.innerHTML = '';
            }
            
            const div = document.createElement('div');
            div.className = 'message';
            
            const hora = new Date(msg.timestamp).toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            div.innerHTML = `
                <div class="message-meta">
                    <span class="message-user">${msg.usuario}</span>
                    <span class="message-type">${msg.tipo}</span>
                    <span class="message-time">${hora}</span>
                </div>
                <div class="message-content">${msg.conteudo}</div>
            `;
            lista.insertBefore(div, lista.firstChild);
        }
        
        function mostrarStatus(mensagem, tipo) {
            const div = document.getElementById('status-chat');
            div.className = 'status ' + tipo;
            div.textContent = mensagem;
            setTimeout(() => {
                div.textContent = '';
                div.className = '';
            }, 3000);
        }
        
        function atualizarMetricasAuto() {
            const rtt = Math.random() * 100;
            const throughput = Math.random() * 1000;
            const loss = Math.random() * 2;
            
            document.getElementById('metrica-rtt').textContent = rtt.toFixed(1);
            document.getElementById('metrica-throughput').textContent = throughput.toFixed(0);
            document.getElementById('metrica-loss').textContent = loss.toFixed(2);
            
            fetch(`${API_URL}/api/metricas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rtt, throughput, packet_loss: loss })
            }).catch(erro => console.error('Erro:', erro));
            
            dadosGrafico.labels.push(new Date().toLocaleTimeString('pt-BR'));
            dadosGrafico.rtt.push(rtt);
            
            if (dadosGrafico.labels.length > 20) {
                dadosGrafico.labels.shift();
                dadosGrafico.rtt.shift();
            }
            
            if (grafico) {
                grafico.data.labels = dadosGrafico.labels;
                grafico.data.datasets[0].data = dadosGrafico.rtt;
                grafico.update();
            } else {
                criarGrafico();
            }
        }
        
        function criarGrafico() {
            const ctx = document.getElementById('grafico').getContext('2d');
            grafico = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dadosGrafico.labels,
                    datasets: [{
                        label: 'RTT (ms)',
                        data: dadosGrafico.rtt,
                        borderColor: '#1a1a1a',
                        backgroundColor: 'rgba(26, 26, 26, 0.05)',
                        borderWidth: 1.5,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        pointBackgroundColor: '#1a1a1a'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#999',
                                font: { size: 11 }
                            },
                            grid: {
                                color: '#f0f0f0',
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: '#999',
                                font: { size: 11 }
                            },
                            grid: {
                                display: false,
                                drawBorder: false
                            }
                        }
                    }
                }
            });
        }
        
        async function carregarAlertas() {
            try {
                const resposta = await fetch(`${API_URL}/api/alertas`);
                const alertas = await resposta.json();
                const lista = document.getElementById('lista-alertas');
                lista.innerHTML = '';
                
                if (alertas.length === 0) {
                    lista.innerHTML = '<div class="no-alerts">Nenhum alerta</div>';
                    return;
                }
                
                alertas.reverse().slice(0, 5).forEach(alerta => adicionarAlertaUI(alerta));
            } catch (erro) {
                console.error('Erro:', erro);
            }
        }
        
        function adicionarAlertaUI(alerta) {
            const lista = document.getElementById('lista-alertas');
            if (lista.querySelector('.no-alerts')) {
                lista.innerHTML = '';
            }
            
            const div = document.createElement('div');
            div.className = 'alert-item';
            
            const hora = new Date(alerta.timestamp).toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            div.innerHTML = `
                <div class="alert-type">⚠ ${alerta.tipo}</div>
                <div class="alert-value">Valor: ${alerta.valor.toFixed(2)} | Limite: ${alerta.threshold}</div>
                <div class="alert-time">${hora}</div>
            `;
            lista.insertBefore(div, lista.firstChild);
        }
    </script>
</body>
</html>
